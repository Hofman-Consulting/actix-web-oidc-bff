version: 2

updates:
  # The necessary counterpart to SHA-pinning every action in .github/workflows.
  # Pinning to a commit SHA removes the tag-hijack risk but freezes the action
  # forever: without an updater, a pinned action is a permanently-unpatched
  # dependency that runs with repository credentials. Dependabot rewrites the
  # SHA and the trailing `# vX.Y.Z` comment together, so the pins stay honest.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The cargo half matters independently of the daily advisory cron in ci.yml,
  # which can only report what RustSec knows about. `webpki-roots` is a
  # vendored snapshot of the Mozilla CA root store (it arrives via
  # openidconnect's `rustls-tls` feature): when Mozilla distrusts a CA, that is
  # a data change, not a code vulnerability, so it never produces a RustSec
  # advisory. Nothing but a version bump surfaces it.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Dependabot does not honour `rust-version`. actix-web 4.18 and actix-http
    # 3.20 raised their MSRV to 1.89 while this crate's is 1.88, so these bumps
    # can only fail the msrv CI job; as of 2026-10-31 they carry no security
    # fixes. Ignoring them does not hide security problems: a RustSec advisory
    # against either crate still surfaces via the cargo-deny advisories cron in
    # ci.yml. Remove this ignore when the crate's MSRV is bumped to >= 1.89.
    ignore:
      - dependency-name: "actix-web"
        versions: [">= 4.18"]
      - dependency-name: "actix-http"
        versions: [">= 3.20"]
