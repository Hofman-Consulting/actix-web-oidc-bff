name: Release-plz

on:
  push:
    branches: [master]

# Least privilege at the top level; each job opts into exactly what it needs.
permissions: {}

jobs:
  release-plz-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # crates.io Trusted Publishing via OIDC; release-plz mints the token
      # natively — deliberately no CARGO_REGISTRY_TOKEN.
      id-token: write
    environment: release
    concurrency:
      # Never cancel an in-flight publish; queue instead.
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz needs full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: release-plz
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          # PAT, not the default GITHUB_TOKEN, so the pushed tag triggers github-release.yml.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Only the latest master state matters for the release PR.
      group: release-plz-pr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz needs full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: release-plz
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          # PAT so ci.yml runs on the release PR.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
