name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly audit so new advisories surface after merge (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

# Least privilege: no job needs write access.
permissions:
  contents: read

# Cancel superseded runs for the same ref (PR pushes); never cancels master/schedule.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Build jobs skip the weekly schedule; only audit runs on cron.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: test
        run: cargo test

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: doc (missing-docs gate)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: check (MSRV 1.88)
        run: cargo check --all-targets --locked

  audit:
    # Runs on push/PR and the weekly schedule. Uses the cargo-audit binary so
    # .cargo/audit.toml (documented RUSTSEC-2023-0071 ignore) is honored.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-audit
      - name: audit
        run: cargo audit

  release-gate:
    # PR-only. release-plz tags the merge commit and a tag-triggered workflow
    # cuts the GitHub Release from the matching CHANGELOG.md section. If that
    # section is missing at the tagged commit the release fails irrecoverably
    # (the tag points at an immutable commit), so block the merge here instead.
    # Passes on normal PRs because the already-released version keeps its section.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: changelog has section for crate version
        run: |
          VERSION=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          echo "Crate version: ${VERSION}"
          if ! grep -q "^## \[${VERSION}\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}] - ...' section."
            echo "Release PRs must roll [Unreleased] into [${VERSION}] before merge."
            exit 1
          fi
          if ! grep -q "^\[${VERSION}\]: " CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing the '[${VERSION}]: ...' link reference."
            echo "Release PRs must roll [Unreleased] into [${VERSION}] before merge."
            exit 1
          fi
          echo "CHANGELOG.md has a complete section for ${VERSION}."
