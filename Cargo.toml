[package]
name = "actix-web-oidc-bff"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Backend-for-Frontend OIDC relying party for actix-web: server-side sessions, PKCE, and provider-agnostic login/callback/logout/me routes."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Hofman-Consulting/actix-web-oidc-bff"
keywords = ["oidc", "openid-connect", "actix-web", "bff", "authentication"]
categories = ["authentication", "web-programming"]
include = ["src/**", "examples/**", "README.md", "LICENSE-APACHE", "LICENSE-MIT", "CHANGELOG.md"]

[dependencies]
actix-web = "4"
actix-session = { version = "0.10", features = ["cookie-session"] }
# default-features off: the bundled reqwest client would otherwise pull
# native-tls; we want rustls. The crate's HTTP calls (discovery, token
# exchange) all go through openidconnect's client.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
tokio = { version = "1", features = ["sync"] }
rand = "0.8"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
log = "0.4"
