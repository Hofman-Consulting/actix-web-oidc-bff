# cargo-deny configuration.
#
# Run locally with:
#   cargo deny check              # advisories + licenses + bans + sources
#   cargo deny check advisories   # just the RustSec database
#
# This crate is an OIDC relying party: it terminates the login flow, verifies
# ID-token signatures and holds the session that stands in for a user's
# identity. Every crate in the tree runs inside that trust boundary, so the
# dependency graph is treated as part of the attack surface — a vulnerable,
# unmaintained or unexpectedly-sourced transitive dependency is a release
# blocker, not a warning.

[graph]
# The crate currently declares no `[features]`, so this is a no-op today. It is
# set anyway so the config stays correct the moment a feature is added (e.g. an
# alternative TLS backend) rather than silently checking only the default set.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Security advisories (RustSec)
# ---------------------------------------------------------------------------
[advisories]
# Schema version 2. The old `vulnerability` / `unmaintained` / `notice` /
# `severity-threshold` keys are gone: vulnerabilities and unsound/unmaintained
# advisories are denied unconditionally, and anything tolerated must be listed
# explicitly in `ignore` below with a justification.
version = 2

# Flag unmaintained crates anywhere in the tree, including transitively.
unmaintained = "all"

# Yanked crates mean the lockfile can no longer be reproduced. Hard failure.
yanked = "deny"

# Every entry needs a justification and a re-evaluation trigger. The sibling
# paykit repo's copy of this file says "empty is the desired steady state" for
# this list. This repo deliberately ships it non-empty: every entry is a
# transitive dependency with no fixed release this crate can reach (`rsa` and
# `crypto-bigint` via `openidconnect`, `h2` via `actix-http`). Each one is
# tolerated only on a documented argument that the vulnerable path is not
# exercised, and each lists the change that would invalidate that argument.
#
# The structured `{ id, reason }` form is used rather than a bare advisory-ID
# string so the justification lives in the tool's own output, not just in a
# comment cargo-deny never reads. (`id` and `crate` are mutually exclusive
# here — cargo-deny rejects a table carrying both — but `crate` is not needed:
# a RustSec ID is issued against one specific crate, so RUSTSEC-2023-0071 can
# only ever match `rsa`. The ignore is crate-pinned by construction.)
ignore = [
    { id = "RUSTSEC-2023-0071", reason = """
rsa 0.9 Marvin attack: a timing sidechannel on RSA private-key operations.
No fixed release exists (the fix lands in rsa 0.10, unreleased at time of
writing). `rsa` is pulled in transitively by `openidconnect` for JWT signature
verification, which uses only RSA *public* keys, so the vulnerable private-key
decryption and signing paths are never exercised by this crate.

Re-evaluate:
  - when rsa 0.10 ships (drop this entry and bump), AND
  - on ANY change that introduces RSA private-key use. The "public keys only"
    premise is behavioural, not structural: openidconnect 4 also supports
    `private_key_jwt` client authentication (signs a client assertion with an
    RSA private key) and JWE-encrypted ID tokens (decrypts with an RSA private
    key). Enabling either would put this crate squarely on the vulnerable path
    and silently invalidate this ignore without changing the dependency graph.
""" },
    { id = "RUSTSEC-2026-0258", reason = """
h2 0.3 accepts and queues empty DATA frames without limit, so a peer that
never lets streams drain can drive unbounded memory growth, or a panic if the
queued length overflows. Rated low severity upstream.

There is no version to upgrade to. The fix ships only in h2 0.4.16; 0.3.27 is
the newest release on the 0.3 line and carries no backport. `h2` is pulled in
by `actix-http`. The lockfile is on actix-http 3.19.0, the newest release
compatible with this crate's MSRV (1.88); the newest release overall, 3.20.0
(requires rustc 1.89), still declares `h2 ^0.3.27`, so moving the MSRV would
not help either. `http2` is one of actix-web's *default* features, so the
whole actix-web 4.x line sits on the unpatched h2 line and `cargo update`
cannot move it.

Scope: this is actix-http's server-side HTTP/2 implementation. This crate is a
library that contributes routes to a consumer's actix-web app; the consumer
runs the server, so the exposure belongs to their whole application rather
than to these routes specifically. Deployments that terminate HTTP/2 at a
reverse proxy or load balancer — the common shape for a BFF — never exercise
actix-http's h2 at all, since the proxy speaks HTTP/1.1 to the app.

Re-evaluate:
  - when actix-web/actix-http ships a release depending on h2 >= 0.4.16
    (expected to require an actix-web major bump) — drop this entry and
    upgrade; OR
  - if h2 backports the fix to 0.3.x — `cargo update -p h2` and drop this
    entry.

Deliberately NOT done: disabling actix-web's default `http2` feature would
drop `h2` from this crate's lockfile and make cargo-deny pass, but Cargo
features are additive across the dependency graph — any consumer enabling
`http2` gets the vulnerable code back. That would silence the signal here
without protecting a single real deployment, which is worse than carrying a
documented ignore.
""" },
    { id = "RUSTSEC-2026-0387", reason = """
crypto-bigint 0.5 is not reliably constant-time: several operations meant to
be constant-time (subtraction, zero counting, division, Montgomery
multiplication, and an early exit in `UintRef` equality) can take
secret-dependent branches — a timing sidechannel on whatever secret integers
pass through them.

There is no version to upgrade to. The fix ships only in crypto-bigint 0.7.6,
with no backport to 0.5.x. The path is openidconnect 4.0.1 -> p256 0.13.2 /
p384 0.13.1 -> ecdsa 0.16 / primeorder -> elliptic-curve 0.13.8 ->
crypto-bigint 0.5.5 (its only dependent). elliptic-curve 0.13 pins
crypto-bigint 0.5, so `cargo update` cannot move it.

Scope: openidconnect uses this code only to *verify* ES256/ES384 ID-token
signatures, and every input to that is public — the IdP's public key, the
signature and the digest. No secret integer reaches crypto-bigint, so a timing
leak has nothing to reveal. `EcdsaP521Sha512` is listed in `ALLOWED_ALGS`
(src/oidc.rs), but p521 is not in the lockfile, so ES512 never goes through
crypto-bigint. The crate performs no EC private-key operations; the only
private key anywhere in the tree is an RSA key in test code. Cookie crypto
(aes-gcm/hmac) and the RNG do not use crypto-bigint, and `rsa` uses
num-bigint-dig instead.

Re-evaluate:
  - when openidconnect moves to elliptic-curve >= 0.14 / crypto-bigint
    >= 0.7.6 — drop this entry and bump; OR
  - if crypto-bigint backports the fix to 0.5.x — `cargo update -p
    crypto-bigint` and drop this entry; AND
  - on ANY change that introduces EC private-key use. As with the rsa entry,
    the "public inputs only" premise is behavioural, not structural:
    `private_key_jwt` client authentication with an ES* key, DPoP proof
    signing, or ECDH-ES JWE decryption would each put a secret scalar through
    crypto-bigint and silently invalidate this ignore without changing the
    dependency graph; AND
  - if openidconnect adds ES512/p521 support (a new crypto-bigint consumer),
    if the advisory is amended to cover verification or public-input paths,
    or if this crate takes a direct dependency on any RustCrypto EC or bigint
    crate.
""" },
]

# ---------------------------------------------------------------------------
# Licences
# ---------------------------------------------------------------------------
[licenses]
version = 2

# Permissive licences only. Nothing copyleft, nothing with a source-disclosure
# or network-use obligation, so downstream consumers can vendor this crate into
# a closed-source application without a legal review.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# Require a high-confidence licence match; a fuzzy match on a hand-edited
# licence file is not good enough to auto-approve.
confidence-threshold = 0.93

# Per-crate exceptions go here (crate name + the licence being allowed for it
# alone). Prefer this over widening `allow` globally.
exceptions = [
    # CDLA-Permissive-2.0 is permissive: no copyleft, no source-disclosure and
    # no network-use obligation, so it does not change the "vendorable into a
    # closed-source app" property that `allow` above is protecting. It is not
    # in the global list because it applies to *data*, not code: webpki-roots
    # ships a snapshot of the Mozilla CA root store, and the licence covers
    # that dataset. In this repo it arrives via `openidconnect`'s `reqwest` +
    # `rustls-tls` features (see Cargo.toml): openidconnect -> oauth2 ->
    # reqwest -> hyper-rustls -> webpki-roots. Note there is no direct reqwest
    # dependency here to attribute it to — openidconnect owns the HTTP client,
    # which is why `default-features = false` on it is load-bearing: the
    # default build would bring native-tls instead.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# Duplicate versions bloat the build and mean two copies of a crate to patch
# when an advisory lands. Warn rather than deny: with the actix-web and reqwest
# stacks in the tree this is largely outside our control.
multiple-versions = "warn"

# Wildcard version requirements make the lockfile meaningless.
wildcards = "deny"

# `highlight` makes the duplicate-version output show the shortest path to the
# crate that pulled the extra copy in.
highlight = "all"

deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
# Only crates.io. A dependency served from an unknown registry or a git URL
# has no yank mechanism and no advisory coverage.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
